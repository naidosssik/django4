{% extends 'base.html' %}

{% block title %}Голосование{% endblock %}

{% block content %}
<h2>Голосование за: {{ nominee.project_name }}</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-check">
        <input class="form-check-input" type="radio" name="choice" id="voteYes" value="Y" checked>
        <label class="form-check-label" for="voteYes">За</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="choice" id="voteNo" value="N">
        <label class="form-check-label" for="voteNo">Против</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="choice" id="voteAbstain" value="A">
        <label class="form-check-label" for="voteAbstain">Воздержался</label>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Голосовать</button>
</form>
{% endblock %}
