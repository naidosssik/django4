{% extends 'base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
  <h2>Вход в аккаунт</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>

  <p class="mt-3">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
{% endblock %}
